apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: ai-lab
  labels:
    app: inference              # the ServiceMonitor scrapes Services with this label
spec:
  type: ClusterIP
  selector:
    app: inference
  ports:
    - name: http                # the ServiceMonitor scrapes /metrics on the port with this name
      port: 80
      targetPort: http
