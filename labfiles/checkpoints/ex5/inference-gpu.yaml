# Checkpoint: the accelerated profile scaled to zero, which releases the GPU node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gpu
  namespace: ai-lab
  labels:
    app: inference-gpu
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inference-gpu
  template:
    metadata:
      labels:
        app: inference-gpu
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: inference
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inference-gpu
      nodeSelector:
        karpenter.sh/nodepool: gpu        # only GPU VM sizes with reserved quota
      tolerations:
        - key: nvidia.com/gpu             # GPU nodes repel pods that don't need a GPU
          operator: Exists
          effect: NoSchedule
      containers:
        - name: inference
          image: <registry>/lab723/inference-gpu:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: lab-environment
            - secretRef:
                name: appinsights
                optional: true
          resources:
            requests: { cpu: "2", memory: 8Gi }
            limits:   { cpu: "2", memory: 8Gi, nvidia.com/gpu: 1 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gpu
  namespace: ai-lab
  labels:
    app: inference-gpu
spec:
  type: ClusterIP
  selector:
    app: inference-gpu
  ports:
    - name: http
      port: 80
      targetPort: http
