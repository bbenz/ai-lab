spec:
  template:
    spec:
      containers:
        - name: inference
          env:
            - name: OMP_NUM_THREADS
              value: "1"
            - name: INFERENCE_THREADS
              value: "1"
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "1", memory: 2Gi }
